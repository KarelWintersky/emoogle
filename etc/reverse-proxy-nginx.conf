# replace with actual IP (without scheme)
upstream backend_emoji_search {
    server localhost:3000;
}

server {
    listen 80;
    server_name emoji.example.com;

#    error_log /var/log/nginx/emoji-search.error.log
#    access_log /var/log/nginx/emoji-search.access.log main;

    location / {
        proxy_pass http://backend_emoji_search;
        proxy_http_version 1.1;
        proxy_set_header Upgrade \$http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location favicon.* { access_log  off; log_not_found off; }
}